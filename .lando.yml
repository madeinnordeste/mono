name: madeinnordeste
recipe: laravel
config:
  webroot: public
  database: mysql
  cache: redis:7
services:
  appserver:
    environment:
      XPTO: /xpta/
  mailhog:
    type: mailhog
    portforward: true
    hogfrom:
      - appserver
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database
proxy:
  mailhog:
    - mailhog.madeinnordeste.lndo.site
  phpmyadmin:
    - phpmyadmin.madeinnordeste.lndo.site